<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti, con todo mi amor para ti mi niña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#050414;
    --night-2:#0c0c2c;
    --night-3:#161345;
    --gold:#f4c869;
    --gold-soft:#f7d998;
    --rose:#f2a6b3;
    --cream:#f6f0e6;
    --card-bg:#12122e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--night-1);
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    color:var(--cream);
  }
  #sky{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(60,40,120,0.55), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(30,20,90,0.5), transparent 55%),
      linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    overflow:hidden;
  }
  .twinkle{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:.6;
    animation:tw 3.5s ease-in-out infinite;
  }
  @keyframes tw{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }

  /* ---------- Bienvenida ---------- */
  #welcome{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    text-align:center;
    background:radial-gradient(ellipse at 50% 40%, #14123a 0%, #050414 75%);
    z-index:50;
    padding:32px;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #welcome.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #welcome h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,46px);
    margin:0 0 14px;
    color:var(--gold-soft);
    letter-spacing:.5px;
  }
  #welcome p{
    max-width:420px;
    font-weight:300;
    font-size:15px;
    line-height:1.7;
    color:#cfcbe6;
    margin:0 0 34px;
  }
  #openBtn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    font-family:'Poppins',sans-serif;
    font-size:14px;
    letter-spacing:.5px;
    padding:14px 30px;
    border-radius:999px;
    cursor:pointer;
    transition:background .35s ease, color .35s ease, transform .3s ease;
  }
  #openBtn:hover{
    background:var(--gold);
    color:#1a1530;
    transform:translateY(-2px);
  }
  #openBtn:focus-visible{outline:2px solid var(--rose);outline-offset:4px;}

  /* ---------- Cielo con estrellas ---------- */
  #stars-layer{
    position:fixed;inset:0;z-index:5;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  #stars-layer.show{opacity:1;}

  .star-btn{
    position:absolute;
    width:22px;height:22px;
    transform:translate(-50%,-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    filter:drop-shadow(0 0 6px rgba(244,200,105,.55));
    animation:pulse 2.8s ease-in-out infinite;
  }
  .star-btn svg{width:100%;height:100%;fill:var(--gold);transition:fill .3s ease, transform .3s ease;}
  .star-btn:hover svg, .star-btn:focus-visible svg{fill:var(--rose);transform:scale(1.35);}
  .star-btn.opened svg{fill:#7d7a9c;filter:none;}
  .star-btn:focus-visible{outline:none;}
  @keyframes pulse{
    0%,100%{filter:drop-shadow(0 0 4px rgba(244,200,105,.4));}
    50%{filter:drop-shadow(0 0 11px rgba(244,200,105,.85));}
  }

  #finalStar{
    width:64px;height:64px;
    z-index:8;
    display:none;
    animation:finalPulse 2.6s ease-in-out infinite;
  }
  #finalStar svg{fill:var(--gold-soft);}
  #finalStar.reveal{animation:finalBurst 1.1s ease-out, finalPulse 2.6s ease-in-out 1.1s infinite;}
  @keyframes finalBurst{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
    55%{transform:translate(-50%,-50%) scale(1.5);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  @keyframes finalPulse{
    0%,100%{filter:drop-shadow(0 0 8px rgba(244,200,105,.5));}
    50%{filter:drop-shadow(0 0 22px rgba(244,200,105,.95));}
  }
  @media (max-width:520px){
    #finalStar{width:52px;height:52px;}
  }

  #counter{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    z-index:10;
    font-size:12px;
    letter-spacing:.5px;
    color:#b9b4d9;
    background:rgba(10,9,30,.45);
    padding:6px 16px;
    border-radius:999px;
    backdrop-filter:blur(3px);
  }
  #counter b{color:var(--gold-soft);font-weight:500;}

  #soundBtn{
    position:fixed;bottom:18px;right:18px;z-index:20;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(244,200,105,.4);
    background:rgba(10,9,30,.55);
    color:var(--gold-soft);
    font-size:17px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Modal de nota ---------- */
  #overlay{
    position:fixed;inset:0;z-index:40;
    background:rgba(3,2,15,.72);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    opacity:0;visibility:hidden;
    transition:opacity .35s ease, visibility .35s ease;
  }
  #overlay.show{opacity:1;visibility:visible;}
  #note-card{
    max-width:440px;width:100%;
    background:linear-gradient(160deg, var(--card-bg), #1b1a3e);
    border:1px solid rgba(244,200,105,.3);
    border-radius:18px;
    padding:36px 30px 30px;
    text-align:center;
    position:relative;
    transform:translateY(14px) scale(.97);
    transition:transform .4s ease;
  }
  #overlay.show #note-card{transform:translateY(0) scale(1);}
  #note-card .glyph{
    width:26px;height:26px;margin:0 auto 16px;
    fill:var(--gold);
  }
  #note-img{
    display:none;
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:12px;
    margin:0 0 18px;
    border:1px solid rgba(244,200,105,.35);
  }
  #note-card.final{max-width:460px;}
  #note-card.final #note-text{font-size:20px;}
  #note-text{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:19px;
    line-height:1.65;
    color:var(--cream);
    margin:0;
  }
  #note-index{
    margin-top:18px;
    font-size:11px;
    letter-spacing:1px;
    color:#8b87ac;
  }
  #closeBtn{
    position:absolute;top:12px;right:14px;
    background:none;border:none;
    color:#8b87ac;font-size:20px;cursor:pointer;
    line-height:1;padding:6px;
  }
  #closeBtn:hover{color:var(--rose);}

  @media (max-width:520px){
    .star-btn{width:20px;height:20px;}
    #note-card{padding:30px 22px 24px;}
    #note-text{font-size:17px;}
  }
  @media (prefers-reduced-motion: reduce){
    .star-btn, .twinkle{animation:none;}
  }
</style>
</head>
<body>

<div id="sky"></div>

<div id="welcome">
  <h1>Porque en cada estrella en el cielo hay un TE QUIERO, y siempre existen más estrellas apra decírtelo</h1>
  <p>Te quiero Siempre</p>
  <button id="openBtn">Abrir el cielo ✦</button>
</div>

<div id="counter"><b id="foundCount">0</b> / 25 estrellas encontradas</div>
<button id="soundBtn" aria-label="Silenciar música">♪</button>

<div id="stars-layer"></div>

<div id="overlay">
  <div id="note-card">
    <button id="closeBtn" aria-label="Cerrar">✕</button>
    <svg class="glyph" viewBox="0 0 24 24"><path d="M12 0l3.09 6.99L22 8.24l-5 5.02L18.18 21 12 17.27 5.82 21 7 13.26l-5-5.02 6.91-1.25z"/></svg>
    <img id="note-img" src="usAF.jpg" alt="">
    <p id="note-text"></p>
    <div id="note-index"></div>
  </div>
</div>

<audio id="bgAudio" src="AFall.mp3" loop preload="auto"></audio>

<script>
const notes = [
  "Mi Niña Linda; mi corazón es eternamente tuyo y quiero que siempre recuerdes que no pertenezco a nadie ni a ningún lugar más que a tu lado.",
  "En cada momento siempre pienso en ti, en amarte y en ver por todo lo que eres.",
  "Mi niña, no hay nada que yo quiera más que estar a tu lado y verte sonreír y feliz, porque tu felicidad es todo para mí.",
  "Amo todo de ti y amaré todo lo que eres siempre.",
  "Eres y serás por siempre ante mis ojos la mujer más perfecta, linda, dedicada, fuerte, inteligente, amable, bondadosa, cariñosa, tierna, brillante, hermosa, interesante. Eres todo, mi niña, te quiero mucho mucho.",
  "Desde el primer momento todo de ti me cautivó y me dejó perplejo; todo de ti es encantador y me vuelve loco.",
  "Cada recuerdo y memoria estando a tu lado son mi más grande tesoro, un recordatorio de todo lo que hemos hecho juntos.",
  "Amo la forma y el sonido de tu risa, de como eres y tu sentido del humor tan contagioso y que pone de buen humor a quién sea.",
  "Cuando algo me sale mal, pensar en ti me recuerda que hay cosas buenas esperándome, y tú eres la mejor de todas.",
  "Quiero ser tu lugar seguro, el sitio al que siempre puedas volver sin importar qué tan difícil sea el día.",
  "Me encanta descubrir cosas nuevas de ti cada día, como si nunca fuera a terminar de conocerte, y eso me emociona.",
  "Eres la razón por la que creo en las cosas bonitas, en el amor que no se cansa y en los finales felices.",
  "No necesito que el día sea perfecto, solo necesito saber que estás en él: en algún mensaje, en algún recuerdo, en algún momento.",
  "Admiro tu fuerza más de lo que te imaginas, la forma en que sigues adelante incluso cuando nadie te ve hacerlo.",
  "Quiero acompañarte en cada meta que te propongas, aplaudirte en cada logro y sostenerte en cada tropiezo.",
  "Contigo el silencio también es bonito; no necesito llenar cada momento de palabras para sentirme en casa.",
  "Cada pequeño detalle tuyo se queda guardado en mi memoria; hasta el más simple se vuelve especial cuando es tuyo.",
  "Quiero seguir sumando recuerdos contigo, de esos que uno guarda para siempre y sonríe al recordarlos años después.",
  "Eres mi persona favorita para contarle las cosas buenas y también las malas, porque contigo todo pesa menos.",
  "Seguir eligiendóte y amandote cada día, es una decisión y una respuesta que tendrás siempre de mí.",
  "Me haces querer ser mejor, no para cambiar quién soy, sino para merecer un poco más todo lo que tú eres.",
  "Sueño con un futuro a tu lado lleno de planes pequeños y grandes, de esos que se construyen juntos, poco a poco.",
  "Quiero ser quien te tome de la mano en los días buenos y quien no la suelte en los días difíciles.",
  "Gracias por elegirme, por quedarte, por seguir aquí incluso cuando yo no sé cómo decir todo lo que siento.",
  "Estas son solo 25 estrellas, mi niña, pero mi amor por ti no cabría ni en el cielo entero."
];

const positions = [
  [8,15],[22,8],[35,20],[48,12],[60,18],[75,10],[88,22],
  [15,35],[30,42],[45,33],[58,45],[70,38],[85,40],
  [10,58],[25,65],[40,55],[55,68],[68,60],[82,55],
  [18,80],[33,85],[47,78],[62,82],[77,75],[90,85]
];

const starSvg = '<svg viewBox="0 0 24 24"><path d="M12 0l3.09 6.99L22 8.24l-5 5.02L18.18 21 12 17.27 5.82 21 7 13.26l-5-5.02 6.91-1.25z"/></svg>';

const layer = document.getElementById('stars-layer');
let found = 0;

positions.forEach((pos, i) => {
  const btn = document.createElement('button');
  btn.className = 'star-btn';
  btn.style.left = pos[0] + '%';
  btn.style.top = pos[1] + '%';
  btn.style.animationDelay = (Math.random()*2.5) + 's';
  btn.innerHTML = starSvg;
  btn.setAttribute('aria-label', 'Estrella ' + (i+1));
  btn.addEventListener('click', () => openNote(i, btn));
  layer.appendChild(btn);
});

const finalStar = document.createElement('button');
finalStar.id = 'finalStar';
finalStar.className = 'star-btn';
finalStar.style.left = '50%';
finalStar.style.top = '50%';
finalStar.innerHTML = starSvg;
finalStar.setAttribute('aria-label', 'Estrella final');
finalStar.addEventListener('click', openFinal);
layer.appendChild(finalStar);

const finalMessage = "Encontraste las 25, mi niña. Pero esto no es el final, es apenas otra forma de decirte que siempre te voy a elegir, hoy, mañana y en todos los días que sigan. Eres todo para mí: mi persona, mi hogar, mi razón para sonreír sin motivo. Mi corazón no deja de amarte ni un solo segundo, y así va a seguir siendo siempre.";

// ambient background twinkles
const sky = document.getElementById('sky');
for (let i=0;i<130;i++){
  const t = document.createElement('div');
  t.className = 'twinkle';
  const s = Math.random()*2 + 0.6;
  t.style.width = s+'px';
  t.style.height = s+'px';
  t.style.left = (Math.random()*100)+'%';
  t.style.top = (Math.random()*100)+'%';
  t.style.animationDelay = (Math.random()*3.5)+'s';
  t.style.animationDuration = (2.5 + Math.random()*3)+'s';
  sky.appendChild(t);
}

const overlay = document.getElementById('overlay');
const noteText = document.getElementById('note-text');
const noteIndex = document.getElementById('note-index');
const foundCount = document.getElementById('foundCount');

const noteImg = document.getElementById('note-img');
const noteCard = document.getElementById('note-card');

function openNote(i, btn){
  noteImg.style.display = 'none';
  noteCard.classList.remove('final');
  noteText.textContent = notes[i];
  noteIndex.textContent = 'Estrella ' + (i+1) + ' de 25';
  overlay.classList.add('show');
  if (!btn.classList.contains('opened')){
    btn.classList.add('opened');
    found++;
    foundCount.textContent = found;
    if (found === notes.length){
      setTimeout(() => {
        finalStar.style.display = 'block';
        finalStar.classList.add('reveal');
      }, 900);
    }
  }
}

function openFinal(){
  noteCard.classList.add('final');
  noteImg.style.display = 'block';
  noteText.textContent = finalMessage;
  noteIndex.textContent = 'Para ti';
  overlay.classList.add('show');
}

function closeNote(){ overlay.classList.remove('show'); }
document.getElementById('closeBtn').addEventListener('click', closeNote);
overlay.addEventListener('click', e => { if (e.target === overlay) closeNote(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNote(); });

// bienvenida + música
const welcome = document.getElementById('welcome');
const starsLayer = document.getElementById('stars-layer');
const audio = document.getElementById('bgAudio');
const soundBtn = document.getElementById('soundBtn');

document.getElementById('openBtn').addEventListener('click', () => {
  welcome.classList.add('hidden');
  starsLayer.classList.add('show');
  audio.volume = 0.55;
  audio.play().catch(() => {});
});

soundBtn.addEventListener('click', () => {
  if (audio.paused){
    audio.play().catch(()=>{});
    soundBtn.textContent = '♪';
  } else {
    audio.pause();
    soundBtn.textContent = '✕';
  }
});
</script>
</body>
</html>
